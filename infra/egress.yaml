api_key: devkey
api_secret: virtual_branch_poc_dev_secret_2026

# Use host LAN IP (same as livekit.yaml node_ip) — reachable from Docker egress Chrome.
ws_url: ws://192.168.21.136:7880
insecure: true

redis:
  address: redis:6379

logging:
  level: debug

storage:
  s3:
    access_key: minioadmin
    secret: minioadmin123
    region: us-east-1
    endpoint: http://minio:9000
    bucket: virtual-branch
    force_path_style: true

# Admission control for concurrent RoomComposite jobs.
# Default cost is 4.0 → only ~2 jobs on a 10-CPU Docker Desktop host.
# ~1.8 allows up to ~5 concurrent RoomComposite on ~10 CPU @ 95% util.
cpu_cost:
  max_cpu_utilization: 0.95
  room_composite_cpu_cost: 1.8
  web_cpu_cost: 1.8
  participant_cpu_cost: 1.5
  track_composite_cpu_cost: 1.0
  track_cpu_cost: 0.5
