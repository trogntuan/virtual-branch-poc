port: 7880

log_level: debug

rtc:
  tcp_port: 7881
  # UDP mux: single port range (easier for Docker egress -> host WebRTC than 50000-60000)
  udp_port: 7882-7892
  use_external_ip: false
  use_ice_lite: true
  # Host LAN IP — egress in Docker and browsers on host must reach this for WebRTC.
  # Mac: `ipconfig getifaddr en0`  |  override at start: livekit-server --node-ip <ip>
  node_ip: 172.20.10.2

redis:
  address: localhost:6379

keys:
  devkey: virtual_branch_poc_dev_secret_2026
