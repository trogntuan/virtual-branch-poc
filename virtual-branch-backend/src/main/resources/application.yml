server:
  port: 8080

spring:
  application:
    name: virtual-branch-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/virtual_branch
    username: virtual_branch
    password: virtual_branch
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 5MB

virtual-branch:
  chat:
    max-file-size-bytes: ${VB_CHAT_MAX_FILE_SIZE_BYTES:3145728}
    max-text-length: ${VB_CHAT_MAX_TEXT_LENGTH:4000}
    allowed-content-types: ${VB_CHAT_ALLOWED_CONTENT_TYPES:application/pdf,application/msword,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,image/jpeg,image/png,image/gif,image/webp}
    allowed-extensions: ${VB_CHAT_ALLOWED_EXTENSIONS:pdf,doc,xls,xlsx,jpg,jpeg,png,gif,webp}
    collab-allowed-content-types: ${VB_CHAT_COLLAB_CONTENT_TYPES:application/pdf}
    collab-allowed-extensions: ${VB_CHAT_COLLAB_EXTENSIONS:pdf}
  cors:
    allowed-origins: ${VB_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  livekit:
    api-url: ${VB_LIVEKIT_API_URL:http://localhost:7880}
    ws-url: ${VB_LIVEKIT_WS_URL:ws://localhost:7880}
    api-key: ${LIVEKIT_API_KEY:devkey}
    api-secret: ${LIVEKIT_API_SECRET:virtual_branch_poc_dev_secret_2026}
  recording:
    # PARTICIPANT = lighter SDK egress (1 side). ROOM_COMPOSITE = grid both sides (heavier).
    egress-mode: ${VB_EGRESS_MODE:ROOM_COMPOSITE}
    participant-prefer: ${VB_EGRESS_PARTICIPANT_PREFER:AGENT}
    # Lower than H264_720P_30 to cut egress CPU while keeping both sides.
    width: ${VB_EGRESS_WIDTH:854}
    height: ${VB_EGRESS_HEIGHT:480}
    framerate: ${VB_EGRESS_FRAMERATE:15}
    video-bitrate: ${VB_EGRESS_VIDEO_BITRATE:1000}
  storage:
    provider: ${VB_STORAGE_PROVIDER:s3}
    endpoint: ${VB_STORAGE_ENDPOINT:http://localhost:9000}
    bucket: ${VB_STORAGE_BUCKET:virtual-branch}
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin123}
    region: ${VB_STORAGE_REGION:}
    force-path-style: ${VB_STORAGE_FORCE_PATH_STYLE:true}
    gcs-credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS:}
    gcs-credentials-json: ${VB_GCS_SA_JSON:}
  egress-storage:
    bucket: ${VB_EGRESS_BUCKET:}
    endpoint: ${VB_EGRESS_ENDPOINT:}
    access-key: ${VB_EGRESS_ACCESS_KEY:}
    secret-key: ${VB_EGRESS_SECRET_KEY:}
    region: ${VB_EGRESS_REGION:auto}
    force-path-style: ${VB_EGRESS_FORCE_PATH_STYLE:true}

logging:
  level:
    com.example.virtualbranch: INFO
    org.springframework.web: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
