spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

virtual-branch:
  cors:
    allowed-origins: ${VB_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://*.run.app}
  livekit:
    api-url: ${VB_LIVEKIT_API_URL}
    ws-url: ${VB_LIVEKIT_WS_URL}
    api-key: ${LIVEKIT_API_KEY}
    api-secret: ${LIVEKIT_API_SECRET}
  storage:
    provider: gcs
    endpoint: ${VB_STORAGE_ENDPOINT:https://storage.googleapis.com}
    bucket: ${VB_STORAGE_BUCKET}
    access-key: ${STORAGE_ACCESS_KEY}
    secret-key: ${STORAGE_SECRET_KEY}
    region: ${VB_STORAGE_REGION:}
    force-path-style: ${VB_STORAGE_FORCE_PATH_STYLE:true}
    gcs-credentials-path: ${GOOGLE_APPLICATION_CREDENTIALS:}
    gcs-credentials-json: ${VB_GCS_SA_JSON:}
  egress-storage:
    bucket: ${VB_EGRESS_BUCKET:}
    endpoint: ${VB_EGRESS_ENDPOINT:}
    access-key: ${VB_EGRESS_ACCESS_KEY:}
    secret-key: ${VB_EGRESS_SECRET_KEY:}
    region: ${VB_EGRESS_REGION:auto}
    force-path-style: ${VB_EGRESS_FORCE_PATH_STYLE:true}

logging:
  level:
    com.example.virtualbranch: INFO
